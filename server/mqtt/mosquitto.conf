# Брокер лобби potenceval. Наружу не смотрит: слушает только localhost,
# снаружи до него доходят через Caddy (wss://mqtt.<домен>/mqtt, TLS от Let's Encrypt).
listener 9001 127.0.0.1
protocol websockets

allow_anonymous true
acl_file /etc/mosquitto/potenceval.acl

# ponytail: всё в памяти, retained-сообщения лобби пропадают при рестарте — хосты
# переподнимают лобби сами. Диск не растёт, данные игроков нигде не оседают.
persistence false

# Защита от мусора: состояние игры весит килобайты, мегабайт — с запасом.
max_packet_size 1048576
max_connections 5000
max_queued_messages 200
max_keepalive 120

# Без адресов игроков в журнале: только ошибки и предупреждения.
connection_messages false
log_dest syslog
log_type error
log_type warning
